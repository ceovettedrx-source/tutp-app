<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#005bbf">
<meta name="robots" content="noindex">
<title>Tut-P is offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f8ff; color: #1a1c1e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
  p { line-height: 1.5; margin: .5rem 0; }
  button { margin-top: 1.25rem; min-height: 48px; padding: 0 1.75rem; border: 0; border-radius: 12px; background: #005bbf; color: #fff; font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/images/icons/icon-192.png" alt="" width="72" height="72">
  <h1>No internet connection</h1>
  <p>Tut-P needs the internet to open your family's page. Check your connection and try again.</p>
  <p lang="te">ఇంటర్నెట్ లేదు. కనెక్షన్ చూసి మళ్ళీ ప్రయత్నించండి.</p>
  <p lang="hi">इंटरनेट नहीं है। कनेक्शन देखकर फिर कोशिश करें।</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
